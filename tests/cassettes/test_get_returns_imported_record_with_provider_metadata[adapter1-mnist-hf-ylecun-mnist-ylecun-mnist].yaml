        Card for MNIST\\n\\t\\n\\n\\n\\t\\n\\t\\t\\n\\t\\n\\t\\n\\t\\tDataset Summary\\n\\t\\n\\nThe
        MNIST dataset consists of 70,000 28x28 black-and-white images of handwritten
        digits extracted from two NIST databases. There are 60,000 images in the training
        dataset and 10,000 images in the validation dataset, one class per digit so
        a total of 10 classes, with 7,000 images (6,000 train images and 1,000 test
        images) per class.\\nHalf of the image were drawn by Census Bureau employees
