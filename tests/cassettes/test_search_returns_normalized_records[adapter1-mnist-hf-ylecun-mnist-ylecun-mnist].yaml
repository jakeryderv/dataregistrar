        MNIST dataset consists of 70,000 28x28 black-and-white images of handwritten
        digits extracted from two NIST databases. There are 60,000 images in the training
        dataset and 10,000 images in the validation dataset, one class per digit so
        a total of 10 classes, with 7,000 images (6,000 train images and 1,000 test
        images) per class.\\nHalf of the image were drawn by Census Bureau employees
        and the other half by high school students\u2026 See the full description
        on the dataset page: https://huggingface.co/datasets/ylecun/mnist.\",\"downloads\":67784,\"paperswithcode_id\":\"mnist\",\"tags\":[\"task_categories:image-classification\",\"task_ids:multi-class-image-classification\",\"annotations_creators:expert-generated\",\"language_creators:found\",\"multilinguality:monolingual\",\"source_datasets:extended|other-nist\",\"language:en\",\"license:mit\",\"size_categories:10K<n<100K\",\"format:parquet\",\"modality:image\",\"library:datasets\",\"library:pandas\",\"library:polars\",\"library:mlcroissant\",\"region:us\"],\"createdAt\":\"2022-03-02T23:29:22.000Z\",\"key\":\"\"},{\"_id\":\"621ffdd236468d709f181e2b\",\"id\":\"zalando-datasets/fashion_mnist\",\"author\":\"zalando-datasets\",\"disabled\":false,\"gated\":false,\"lastModified\":\"2024-08-08T06:10:25.000Z\",\"likes\":67,\"private\":false,\"sha\":\"531be5e2ccc9dba0c201ad3ae567a4f3d16ecdd2\",\"description\":\"\\n\\t\\n\\t\\t\\n\\t\\tDataset
