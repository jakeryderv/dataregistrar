        DEPTH","METEOROLOGICAL HAZARDS"],"contactInfo":"Email ncei.info@noaa.gov Online
        Resource NCEI Contact Information https://www.ncei.noaa.gov/contact","endDate":"2026-09-03","topics":[],"orderable":false,"description":"While
        the Fujita and Saffir-Simpson Scales characterize tornadoes and hurricanes
        respectively, there is no widely used scale to classify snowstorms. The Northeast
        Snowfall Impact Scale (NESIS) developed by Paul Kocin of The Weather Channel
        and Louis Uccellini of the National Weather Service characterizes and ranks
        high-impact Northeast snowstorms. These storms have large areas of 10 inch
        snowfall accumulations and greater. NESIS has five categories: Extreme, Crippling,
        Major, Significant, and Notable. The index differs from other meteorological
        indices in that it uses population information in addition to meteorological
        measurements. Thus NESIS gives an indication of a storm''s societal impacts.
        NESIS scores are a function of the area affected by the snowstorm, the amount
        of snow, and the number of people living in the path of the storm. The aerial
        distribution of snowfall and population information are combined in an equation
        that calculates a NESIS score which varies from around one for smaller storms
        to over ten for extreme storms. The raw score is then converted into one of
        the five NESIS categories. The largest NESIS values result from storms producing
        heavy snowfall over large areas that include major metropolitan centers. For
        details on how NESIS scores are calculated at the National Climatic Data Center,
        see Squires and Lawrimore (2006).","people":[],"searchable":false,"frequency":"notPlanned","dataTypes":[],"organization":{"name":"NOAA
