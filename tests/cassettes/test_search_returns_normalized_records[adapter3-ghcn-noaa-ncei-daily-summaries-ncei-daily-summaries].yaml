        ncei.info@noaa.gov Online Resource NCEI Contact Information https://www.ncei.noaa.gov/contact\",\"endDate\":\"2026-09-04\",\"topics\":[],\"orderable\":true,\"description\":\"The
        Global Historical Climatology Network - Daily (GHCN-Daily/GHCNd) dataset integrates
        daily climate observations from approximately 30 different data sources. Version
        3 was released in September 2012 with the addition of data from two additional
        station networks. Changes to the processing system associated with the version
        3 release also allowed for updates to occur 7 days a week rather than only
        on most weekdays. Version 3 contains station-based measurements from well
        over 90,000 land-based stations worldwide, about two thirds of which are for
        precipitation measurement only. Other meteorological elements include, but
        are not limited to, daily maximum and minimum temperature, temperature at
        the time of observation, snowfall and snow depth. Over 25,000 stations are
        regularly updated with observations from within roughly the last month. The
        dataset is also routinely reconstructed (usually every week) from its roughly
        30 data sources to ensure that GHCNd is generally in sync with its growing
        list of constituent sources. During this process, quality assurance checks
        are applied to the full dataset. Where possible, GHCNd station data are also
        updated daily from a variety of data streams. Station values for each daily
        update also undergo a suite of quality checks.\",\"people\":[{\"role\":\"principalInvestigator\",\"organization\":{\"name\":\"DOC/NOAA/NESDIS/NCDC
