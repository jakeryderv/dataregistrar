        Contact Information https://www.ncei.noaa.gov/contact\",\"endDate\":\"2026-09-04\",\"topics\":[],\"orderable\":true,\"description\":\"*This
        version has been superseded by a newer version. It is highly recommended for
        users to access the current version. Users should only access this superseded
        version for special cases, such as reproducing studies. If necessary, this
        version can be accessed by contacting NCEI.* The NOAA Global Surface Temperature
        Dataset (NOAAGlobalTemp) is a monthly global merged land-ocean surface temperature
        analysis product that is derived from two independent analyses. The first
        is the Extended Reconstructed Sea Surface Temperature (ERSST) analysis and
        the second is a land surface air temperature (LSAT) analysis that uses the
        Global Historical Climatology Network - Monthly (GHCN-M) temperature database.
        The NOAAGlobalTemp data set contains global surface temperatures in gridded
        (5\xB0 \xD7 5\xB0) and monthly resolution time series (from 1850 to present
        time) data files. The product is used in climate monitoring assessments of
        near-surface temperatures on a global scale. This version, v6.0, an updated
        version to the current operational release v5.1, is implemented by an Artificial
        Neural Network method to improve the surface temperature reconstruction over
