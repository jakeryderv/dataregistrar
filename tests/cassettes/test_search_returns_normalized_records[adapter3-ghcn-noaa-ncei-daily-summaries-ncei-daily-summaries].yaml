        Historical Climatology Network-hourly (GHCNh) is a multisource collection
        of weather station (meteorological) observations from the late 18th Century
        to the present from fixed weather stations over land across the globe. It
        is replacing the Integrated Surface Dataset (ISD) and will be used to generate
        the Local Climatological Data and Global Summary of the Day datasets. The
        hourly dataset is constructed to align with GHCN daily. Version 1 contains
        approximately 110 separate data sources and will be updated daily using the
        United States Air Force and NOAA Surface Weather Observations data streams.
        GHCNh v1 contains the following variables: altimeter; dew_point_temperature;
