        Online Resource NCEI Contact Information https://www.ncei.noaa.gov/contact\",\"endDate\":\"2026-09-04\",\"topics\":[],\"orderable\":false,\"description\":\"The
        NOAA Monthly U.S. Climate Gridded Dataset (NClimGrid) consists of four climate
        variables derived from the GHCN-D dataset: maximum temperature, minimum temperature,
        average temperature and precipitation. Each file provides monthly values in
        a 5x5 lat/lon grid for the Continental United States. Data is available from
        1895 to the present. In March 2015, new Alaska data was included in the nClimDiv
        dataset. The Alaska nClimDiv data were created and updated using similar methodology
        as that for the CONUS. It includes maximum temperature, minimum temperature,
        average temperature and precipitation. In January 2025, the National Centers
        for Environmental Information (NCEI) began summarizing the State of the Climate
        for Hawaii. This was made possible through a collaboration between NCEI and
        the University of Hawaii/Hawaii Climate Data Portal and completes a long-standing
        gap in NCEI's ability to characterize the State of the Climate for all 50
        states. NCEI maintains monthly statewide, divisional, and gridded average
        temperature, maximum temperatures (highs), minimum temperature (lows) and
        precipitation data for Hawaii over the period 1991-2025.\",\"people\":[{\"role\":\"principalInvestigator\",\"organization\":{\"name\":\"NOAA
