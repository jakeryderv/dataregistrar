        ncei.info@noaa.gov Online Resource NCEI Contact Information https://www.ncei.noaa.gov/contact\",\"endDate\":\"2026-09-04\",\"topics\":[],\"orderable\":false,\"description\":\"The
        Global Historical Climatology Network (GHCN) Monthly Precipitation, Version
        4 is a collection of worldwide monthly precipitation values with measurement,
        quality control, and source flags for global locations. Values are in tenths
        of a millimeter and coverage is mostly global land masses with voids as expected
        in less populated areas. It offers significant enhancements over the previous
        version 2. It contains more values both historically and for the most recent
        months. Its methods for merging records and quality control have been modernized.
        It is used by the National Centers for Environmental Information (NCEI) to
        put recent months' precipitation into a historical context. The data set is
        updated each month and available through NCEI's data access portal.\",\"people\":[{\"role\":\"author\",\"organization\":{\"name\":\"NOAA
